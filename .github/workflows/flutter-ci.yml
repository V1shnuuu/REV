name: Flutter CI

# GitHub's "suggested workflows" panel offers Django and Python templates for
# this repo. Both are false positives: the only Python here is
# tool/contrast_check.py, a standalone WCAG audit utility. This is a Flutter
# app, and this workflow is the one that actually matches the stack.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        # The project currently has 12 known info-level issues, all in the
        # service layer (debug prints, speech_to_text deprecations). Those are
        # tracked separately; --no-fatal-infos keeps CI honest about errors and
        # warnings without going red on them. Remove this flag once they're
        # addressed.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  contrast-audit:
    name: WCAG Contrast Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fails the build if any design token pairing drops below its WCAG AA
      # threshold. This is the gate that caught white-on-coral button labels
      # at 3.09:1 during Phase 1.
      - name: Check design token contrast
        run: python tool/contrast_check.py

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
